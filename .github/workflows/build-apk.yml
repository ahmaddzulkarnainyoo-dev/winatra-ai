name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Inject API keys
        run: |
          IFS=',' read -r -a keys <<< "${{ secrets.GROQ_API_KEYS }}"
          for i in "${!keys[@]}"; do
            num=$((i+1))
            sed -i "s#BUILD_GROQ_KEY_$num#${keys[$i]}#g" android/app/src/main/kotlin/com/example/winatra_ai/WinatraService.kt
            sed -i "s#BUILD_GROQ_KEY_$num#${keys[$i]}#g" android/app/src/main/kotlin/com/example/winatra_ai/WinatraKeyboardService.kt
          done
          sed -i "s#BUILD_DEEPSEEK_KEY#${{ secrets.DEEPSEEK_API_KEY }}#g" android/app/src/main/kotlin/com/example/winatra_ai/WinatraService.kt
          sed -i "s#BUILD_DEEPSEEK_KEY#${{ secrets.DEEPSEEK_API_KEY }}#g" android/app/src/main/kotlin/com/example/winatra_ai/WinatraKeyboardService.kt

      # 🔥 OVERWRITE build.gradle dengan versi yang benar (tanpa BOM)
      - name: Overwrite android/app/build.gradle
        run: |
          cat > android/app/build.gradle << 'EOF'
          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }
          def flutterRoot = localProperties.getProperty('flutter.sdk')
          if (flutterRoot == null) throw new GradleException("Flutter SDK not found.")
          def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
          def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          apply plugin: 'com.google.gms.google-services'
          apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

          android {
              compileSdk 34
              ndkVersion "27.0.12077973"
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled true
              }
              kotlinOptions { jvmTarget = '17' }
              defaultConfig {
                  applicationId "com.example.winatra_ai"
                  minSdk 24
                  targetSdk 34
                  versionCode flutterVersionCode.toInteger()
                  versionName flutterVersionName
              }
              buildTypes { release { signingConfig signingConfigs.debug } }
          }
          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation platform('com.google.firebase:firebase-bom:33.7.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winatra-ai-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7