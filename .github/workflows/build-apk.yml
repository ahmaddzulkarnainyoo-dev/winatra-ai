name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.4'
          channel: 'stable'

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.GROQ_API_KEYS }}" ]; then
            echo "ERROR: GROQ_API_KEYS secret not set!"
            exit 1
          fi
          if [ -z "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            echo "ERROR: DEEPSEEK_API_KEY secret not set!"
            exit 1
          fi
          echo "✓ Secrets available"

      - name: Inject Groq API Keys (24 keys)
        run: |
          IFS=',' read -r -a keys <<< "${{ secrets.GROQ_API_KEYS }}"
          for i in "${!keys[@]}"; do
            num=$((i+1))
            sed -i "s#BUILD_GROQ_KEY_$num#${keys[$i]}#g" \
              android/app/src/main/kotlin/com/example/winatra_ai/WinatraService.kt
            sed -i "s#BUILD_GROQ_KEY_$num#${keys[$i]}#g" \
              android/app/src/main/kotlin/com/example/winatra_ai/WinatraKeyboardService.kt
          done

      - name: Inject DeepSeek API Key
        run: |
          sed -i "s#BUILD_DEEPSEEK_KEY#${{ secrets.DEEPSEEK_API_KEY }}#g" \
            android/app/src/main/kotlin/com/example/winatra_ai/WinatraService.kt
          sed -i "s#BUILD_DEEPSEEK_KEY#${{ secrets.DEEPSEEK_API_KEY }}#g" \
            android/app/src/main/kotlin/com/example/winatra_ai/WinatraKeyboardService.kt

      - name: Verify Key Injection
        run: |
          echo "Verifying key injection..."
          if grep -q "BUILD_GROQ_KEY_" android/app/src/main/kotlin/com/example/winatra_ai/WinatraService.kt; then
            echo "WARNING: Some Groq placeholders still found"
          else
            echo "✓ Groq placeholders replaced in WinatraService"
          fi
          if grep -q "BUILD_DEEPSEEK_KEY" android/app/src/main/kotlin/com/example/winatra_ai/WinatraService.kt; then
            echo "WARNING: DeepSeek placeholder still found"
          else
            echo "✓ DeepSeek placeholder replaced"
          fi
          if grep -q "BUILD_GROQ_KEY_" android/app/src/main/kotlin/com/example/winatra_ai/WinatraKeyboardService.kt; then
            echo "WARNING: Some Groq placeholders still found in keyboard"
          else
            echo "✓ Groq placeholders replaced in keyboard"
          fi
          if grep -q "BUILD_DEEPSEEK_KEY" android/app/src/main/kotlin/com/example/winatra_ai/WinatraKeyboardService.kt; then
            echo "WARNING: DeepSeek placeholder still found in keyboard"
          else
            echo "✓ DeepSeek placeholder replaced in keyboard"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winatra-ai-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7