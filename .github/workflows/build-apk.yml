name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.5'
          channel: 'stable'

      - name: Create google-services.json from secret
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Inject API keys
        run: |
          IFS=',' read -r -a keys <<< "${{ secrets.GROQ_API_KEYS }}"
          for i in "${!keys[@]}"; do
            num=$((i+1))
            sed -i "s#BUILD_GROQ_KEY_$num#${keys[$i]}#g" android/app/src/main/kotlin/com/example/winatra_ai/WinatraService.kt
            sed -i "s#BUILD_GROQ_KEY_$num#${keys[$i]}#g" android/app/src/main/kotlin/com/example/winatra_ai/WinatraKeyboardService.kt
          done
          sed -i "s#BUILD_DEEPSEEK_KEY#${{ secrets.DEEPSEEK_API_KEY }}#g" android/app/src/main/kotlin/com/example/winatra_ai/WinatraService.kt
          sed -i "s#BUILD_DEEPSEEK_KEY#${{ secrets.DEEPSEEK_API_KEY }}#g" android/app/src/main/kotlin/com/example/winatra_ai/WinatraKeyboardService.kt

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winatra-ai-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
