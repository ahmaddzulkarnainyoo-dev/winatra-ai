name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Validate Secrets
        run: |
          echo "Checking if secrets are available..."
          if [ -z "${{ secrets.GROQ_API_KEYS }}" ]; then
            echo "ERROR: GROQ_API_KEYS secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            echo "ERROR: DEEPSEEK_API_KEY secret is not set!"
            exit 1
          fi
          echo "✓ Secrets are available"

      - name: Inject Groq API Keys (24 keys)
        run: |
          IFS=',' read -r -a keys <<< "${{ secrets.GROQ_API_KEYS }}"
          echo "Processing ${#keys[@]} Groq keys..."
          
          for i in "${!keys[@]}"; do
            num=$((i+1))
            key="${keys[$i]}"
            # Use # as sed delimiter to avoid conflicts with special chars in keys
            sed -i "s#BUILD_GROQ_KEY_$num#$key#g" \
              android/app/src/main/kotlin/com/example/winatra_ai/WinatraService.kt
            sed -i "s#BUILD_GROQ_KEY_$num#$key#g" \
              android/app/src/main/kotlin/com/example/winatra_ai/WinatraKeyboardService.kt
            echo "  ✓ Injected Groq key $num"
          done

      - name: Inject DeepSeek API Key
        run: |
          echo "Processing DeepSeek key..."
          deepseek_key="${{ secrets.DEEPSEEK_API_KEY }}"
          sed -i "s#BUILD_DEEPSEEK_KEY#$deepseek_key#g" \
            android/app/src/main/kotlin/com/example/winatra_ai/WinatraService.kt
          sed -i "s#BUILD_DEEPSEEK_KEY#$deepseek_key#g" \
            android/app/src/main/kotlin/com/example/winatra_ai/WinatraKeyboardService.kt
          echo "  ✓ DeepSeek key injected"

      - name: Verify Key Injection
        run: |
          echo "Verifying key injection..."
          
          # Check if BUILD_ placeholders still exist
          if grep -q "BUILD_GROQ_KEY_" android/app/src/main/kotlin/com/example/winatra_ai/WinatraService.kt; then
            echo "WARNING: Some Groq placeholders still found in WinatraService.kt"
            grep "BUILD_GROQ_KEY_" android/app/src/main/kotlin/com/example/winatra_ai/WinatraService.kt | head -5
          else
            echo "✓ All Groq placeholders replaced in WinatraService.kt"
          fi
          
          if grep -q "BUILD_DEEPSEEK_KEY" android/app/src/main/kotlin/com/example/winatra_ai/WinatraService.kt; then
            echo "WARNING: DeepSeek placeholder still found in WinatraService.kt"
          else
            echo "✓ DeepSeek placeholder replaced in WinatraService.kt"
          fi
          
          if grep -q "BUILD_GROQ_KEY_" android/app/src/main/kotlin/com/example/winatra_ai/WinatraKeyboardService.kt; then
            echo "WARNING: Some Groq placeholders still found in WinatraKeyboardService.kt"
            grep "BUILD_GROQ_KEY_" android/app/src/main/kotlin/com/example/winatra_ai/WinatraKeyboardService.kt | head -5
          else
            echo "✓ All Groq placeholders replaced in WinatraKeyboardService.kt"
          fi
          
          if grep -q "BUILD_DEEPSEEK_KEY" android/app/src/main/kotlin/com/example/winatra_ai/WinatraKeyboardService.kt; then
            echo "WARNING: DeepSeek placeholder still found in WinatraKeyboardService.kt"
          else
            echo "✓ DeepSeek placeholder replaced in WinatraKeyboardService.kt"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winatra-ai-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7