name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Step 1: Checkout repo ke folder sementara (/tmp/repo)
      - uses: actions/checkout@v4
        with:
          path: /tmp/repo

      # Step 2: Setup Java + Flutter
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      # Step 3: Debug Flutter info
      - name: Debug Flutter version
        run: flutter --version

      # Step 4: Buat project Flutter BARU di folder terpisah
      - name: Create fresh Flutter project
        run: |
          # Buat folder project baru
          mkdir -p /tmp/fresh-project
          cd /tmp/fresh-project
          flutter create --project-name winatra_ai --platforms=android .
          
          echo "=== Fresh project created ==="
          ls -la /tmp/fresh-project/
          echo "=== android/ ==="
          ls -la /tmp/fresh-project/android/

      # Step 5: Copy source code dari repo backup
      - name: Copy source code from original repo
        run: |
          # Copy pubspec.yaml
          cp /tmp/repo/pubspec.yaml ${{ github.workspace }}/pubspec.yaml
          
          # Copy lib/
          rm -rf ${{ github.workspace }}/lib/
          cp -r /tmp/repo/lib ${{ github.workspace }}/lib
          
          # Copy assets/
          rm -rf ${{ github.workspace }}/assets/
          if [ -d /tmp/repo/assets ]; then
            cp -r /tmp/repo/assets ${{ github.workspace }}/assets
          fi
          
          # Copy google-services.json
          if [ -f /tmp/repo/android/app/google-services.json ]; then
            mkdir -p ${{ github.workspace }}/android/app
            cp /tmp/repo/android/app/google-services.json ${{ github.workspace }}/android/app/google-services.json
            echo "google-services.json copied"
          else
            echo "{}" > ${{ github.workspace }}/android/app/google-services.json
            echo "google-services.json placeholder created"
          fi
          
          echo "=== Source files copied ==="

      # Step 6: Add google-services plugin
      - name: Add google-services plugin
        run: |
          cd ${{ github.workspace }}
          
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*" apply false/id("org.jetbrains.kotlin.android") version "2.2.20" apply false\n    id("com.google.gms.google-services") version "4.4.0" apply false/' android/settings.gradle.kts
            echo "=== settings.gradle.kts ==="
            cat android/settings.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*" apply false/id "org.jetbrains.kotlin.android" version "2.2.20" apply false\n    id "com.google.gms.google-services" version "4.4.0" apply false/' android/settings.gradle
            echo "=== settings.gradle ==="
            cat android/settings.gradle
          else
            echo "ERROR: No settings file!"
            exit 1
          fi

      # Step 7: Override app/build.gradle
      - name: Override app/build.gradle
        run: |
          cd ${{ github.workspace }}
          cat > android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "com.google.gms.google-services"
          }

          android {
              compileSdk 34
              ndkVersion "27.0.12077973"

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled true
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId "com.example.winatra_ai"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          dependencies {
              implementation "com.squareup.okhttp3:okhttp:4.12.0"
              implementation platform("com.google.firebase:firebase-bom:33.7.0")
              implementation "com.google.firebase:firebase-auth"
              implementation "com.google.firebase:firebase-firestore"
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
          }
          EOF
          
          echo "=== app/build.gradle written ==="

      # Step 8: Debug final structure
      - name: Debug final project structure
        run: |
          cd ${{ github.workspace }}
          echo "=== Workspace content ==="
          ls -la
          echo "=== pubspec.yaml exists ==="
          test -f pubspec.yaml && echo "YES" || echo "NO"
          echo "=== android/settings file ==="
          find android -name "settings*" -type f
          echo "=== android/app/build.gradle ==="
          head -20 android/app/build.gradle

      # Step 9: Install dependencies
      - name: Install dependencies
        run: |
          cd ${{ github.workspace }}
          flutter pub get

      # Step 10: Build APK
      - name: Build APK
        run: |
          cd ${{ github.workspace }}
          flutter build apk --release --split-per-abi

      # Step 11: Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winatra-ai-release
          path: ${{ github.workspace }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 7