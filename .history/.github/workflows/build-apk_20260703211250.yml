name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'

      - name: Restore google-services.json
        run: |
          mkdir -p android/app
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json already exists"
          else
            python3 -c "
import json
config = {
    'project_info': {
        'project_number': '000000000000',
        'project_id': 'dummy-project'
    },
    'client': [{
        'client_info': {
            'mobilesdk_app_id': '1:000000000000:android:0000000000000000',
            'android_client_info': {
                'package_name': 'com.example.winatra_ai'
            }
        },
        'oauth_client': [],
        'api_key': [{'current_key': 'AIzaSyDummyKey00000000000000000000000000000'}],
        'services': {
            'appinvite_service': {
                'other_platform_oauth_client': []
            }
        }
    }],
    'configuration_version': '1'
}
with open('android/app/google-services.json', 'w') as f:
    json.dump(config, f, indent=2)
"
          fi

      - name: Verify build.gradle.kts exists
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            echo "build.gradle.kts already exists in repo"
          else
            echo "ERROR: build.gradle.kts not found!" >&2
            exit 1
          fi
      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winatra-ai-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
