name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'main'

      - name: Restore google-services.json
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json already exists"
          else
            cp android/app/google-services-ci.json android/app/google-services.json
            echo "Using CI dummy google-services.json"
          fi

      - name: Verify build.gradle.kts exists
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            echo "build.gradle.kts already exists in repo"
          else
            echo "ERROR: build.gradle.kts not found!" >&2
            exit 1
          fi
      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Find and Upload APK
        run: |
          echo "Looking for APK files..."
          find build -name "*.apk" -type f 2>/dev/null || echo "No APK found in build/"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "No flutter-apk directory"
          ls -la build/app/outputs/ 2>/dev/null || echo "No outputs directory"
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winatra-ai-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
          retention-days: 7
