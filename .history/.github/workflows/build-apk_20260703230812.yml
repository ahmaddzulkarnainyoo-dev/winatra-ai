name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'main'

      - name: Restore google-services.json
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json already exists"
          else
            cp android/app/google-services-ci.json android/app/google-services.json
            echo "Using CI dummy google-services.json"
          fi

      - name: Verify build.gradle.kts exists
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            echo "build.gradle.kts already exists in repo"
          else
            echo "ERROR: build.gradle.kts not found!" >&2
            exit 1
          fi
      - name: Install dependencies
        run: flutter pub get

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        shell: bash

      - name: Find APK
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== Checking android/build/outputs ==="
          ls -la android/build/outputs/apk/ 2>/dev/null || echo "No apk dir in android/build/outputs"
          echo "=== Checking build/app/outputs ==="
          ls -la build/app/outputs/ 2>/dev/null || echo "No outputs dir"
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winatra-ai-release
          path: |
            android/build/outputs/apk/**/*.apk
            build/app/outputs/**/*.apk
          retention-days: 7
