name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'main'

      - name: Restore google-services.json
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json already exists"
          else
            cp android/app/google-services-ci.json android/app/google-services.json
            echo "Using CI dummy google-services.json"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        shell: bash

      - name: Copy APK to output folder
        run: |
          mkdir -p apk-output
          find . -path "*/build/outputs/apk/*" -name "*.apk" -type f -exec cp {} apk-output/ \;
          find . -path "*/build/app/outputs/*" -name "*.apk" -type f -exec cp {} apk-output/ \; 2>/dev/null || true
          echo "=== APK files found ==="
          ls -la apk-output/
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winatra-ai-release
          path: apk-output/
          retention-days: 7
